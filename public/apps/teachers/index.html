<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f0f8f5">
  <title>Teacher App · OctoMinds</title>
  <link rel="icon" href="/assets/octominds-icon-192.png">
  <link rel="stylesheet" href="/apps/parents/parents.css?v=pwa-1">
  <link rel="stylesheet" href="/apps/teachers/teachers.css?v=1">
</head>
<body data-portal="teacher">
  <a class="skip" href="#main">Skip to content</a>
  <main id="auth" class="teacher-sign-in" aria-labelledby="authTitle">
    <section>
      <img class="logo" src="/assets/octominds-logo-horizontal.png" alt="OctoMinds">
      <h1 id="authTitle">Teacher App</h1>
      <p>Sign in with your school account to open your classes.</p>
      <form id="loginForm">
        <label>Email or mobile number<input id="identity" autocomplete="username" maxlength="254" required></label>
        <label for="password">Password or six-digit PIN</label>
        <div class="password-field">
          <input id="password" type="password" autocomplete="current-password" minlength="6" maxlength="128" required>
          <button id="togglePassword" type="button" aria-controls="password" hidden>Show<span class="sr-only"> password or PIN</span></button>
        </div>
        <label class="check"><input id="remember" type="checkbox">Keep me signed in on this device</label>
        <button type="submit" class="primary">Sign in to Teacher App</button>
      </form>
      <p id="authMessage" role="status" aria-live="polite"></p>
      <a href="/school">School administration and account help</a>
    </section>
  </main>
  <div id="portal" hidden>
    <div class="app-layout">
      <header class="topbar">
        <span class="portal-label">OctoMinds Teacher App</span>
        <a class="mobile-brand" href="/teachers" aria-label="OctoMinds Teacher App"><img class="logo" src="/assets/octominds-logo-horizontal.png" alt=""></a>
        <div class="header-actions"><span id="accountName"></span><button id="signOut" class="quiet" type="button">Sign out</button></div>
      </header>
      <aside class="sidebar">
        <a class="brand-link" href="/teachers" aria-label="OctoMinds Teacher App"><img class="logo" src="/assets/octominds-logo-horizontal.png" alt="OctoMinds"></a>
        <nav id="navigation" aria-label="Main navigation"></nav>
        <div class="teacher-external-links"><a href="/parents">Family Portal</a><a href="/school">School administration</a></div>
      </aside>
      <div class="app-body">
        <main id="main" tabindex="-1">
          <div class="page-heading">
            <a id="childBack" class="child-back" href="#/classroom" hidden><span aria-hidden="true">←</span> <span id="childBackLabel">Classroom</span></a>
            <div class="page-heading-copy">
              <p id="todayGreeting" hidden></p>
              <div class="page-title-line">
                <span id="sectionSymbol" class="section-symbol" aria-hidden="true" hidden></span>
                <img id="childBrand" src="/assets/octominds-icon-192.png" alt="" width="32" height="32" hidden>
                <h1 id="pageTitle">Teacher workspace</h1>
              </div>
              <p id="pageDescription"></p>
            </div>
            <button id="calendarExport" type="button" hidden disabled>Export calendar</button>
            <div id="childPicker" class="child-picker" hidden>
              <label for="childSelect">Switch student</label>
              <span id="childChoice" class="child-choice" hidden>
                <span id="childChoiceInitials" aria-hidden="true"></span><strong id="childChoiceName"></strong><span id="childChoiceArrow" aria-hidden="true">▾</span>
              </span>
              <select id="childSelect"></select>
            </div>
          </div>
          <label id="teacherClassPicker" class="teacher-class-picker" hidden>Working class<select id="teacherClass"></select></label>
          <div id="content" aria-live="polite"></div>
        </main>
      </div>
    </div>
  </div>
  <dialog id="editor" aria-labelledby="editorTitle">
    <form id="editorForm">
      <div class="dialog-heading"><h2 id="editorTitle"></h2><button type="button" data-close class="quiet" aria-label="Close form">×</button></div>
      <p id="editorDescription" class="muted"></p>
      <div id="editorFields"></div>
      <p id="editorError" role="alert"></p>
      <div class="dialog-actions"><button type="button" data-close class="secondary">Cancel</button><button type="submit" class="primary">Publish</button></div>
    </form>
  </dialog>
  <p id="toast" role="status" class="toast" hidden></p>
  <script src="/config.js"></script>
  <script src="/assets/session.js?v=1"></script>
  <script type="module" src="/apps/parents/parents.js?v=teacher-1"></script>
</body>
</html>
