name: Repository checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: development
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: npm test
      - run: python -m compileall -q api
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: npx playwright install --with-deps chromium
      - name: Parent browser workflows and accessibility
        run: |
          python -m uvicorn api.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/parents-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python - <<'PY'
          import time, urllib.request
          for attempt in range(50):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=1)
                  break
              except OSError:
                  time.sleep(0.2)
          else:
              raise SystemExit('Local test server did not start')
          PY
          npm run test:parents
          npm run test:gallery
