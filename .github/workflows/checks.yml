name: Repository checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: development
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_ANON_KEY: ""
      SUPABASE_JWT_SECRET: ""
      DATABASE_URL: ""
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: test_parents
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: npm test
      - run: python -m compileall -q api
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Parent database security and workflow checks
        env:
          TEST_DATABASE_URL: postgresql://postgres:local-test-only@127.0.0.1:5432/test_parents
        run: python tests/gallery-database-regressions.py
      - run: npx playwright install --with-deps chromium
      - name: Parent browser workflows and accessibility
        run: |
          python -m uvicorn api.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/parents-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python - <<'PY'
          import time, urllib.request
          for attempt in range(50):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=1)
                  break
              except OSError:
                  time.sleep(0.2)
          else:
              raise SystemExit('Local test server did not start')
          PY
          npm run test:parents
          npm run test:gallery
