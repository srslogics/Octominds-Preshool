<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="same-origin">
  <meta name="theme-color" content="#211c35">
  <title>School administration · OctoMinds</title>
  <link rel="icon" href="/assets/octominds-icon-192.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/apps/school/school.css?v=family-enrollment-1">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <main id="auth" class="auth-wrap" aria-labelledby="authTitle">
    <div class="auth-card">
      <img class="brand" src="/assets/octominds-logo-horizontal.png" alt="OctoMinds">
      <p class="eyebrow">School administration</p>
      <h1 id="authTitle">Welcome back</h1>
      <p id="authDescription">Sign in with your email and password or your mobile number and PIN.</p>
      <form id="signInForm">
        <label>Email or mobile number<input id="identity" autocomplete="username" required maxlength="254"></label>
        <label>Password or PIN<input id="password" type="password" autocomplete="current-password" required minlength="6" maxlength="128"></label>
        <label class="check"><input id="remember" type="checkbox">Keep me signed in on this device</label>
        <button class="primary" type="submit">Sign in</button>
      </form>
      <div class="auth-actions">
        <button id="createAccount" type="button" class="text" hidden>Create invited account</button>
        <button id="recover" type="button" class="text">Forgot password</button>
      </div>
      <form id="mobileSignupForm" hidden>
        <label>Invited mobile number<input id="invitedMobile" type="tel" autocomplete="tel" placeholder="e.g. +91 98765 43210" required maxlength="30"></label>
        <label>New six-digit PIN<input id="newPin" type="password" inputmode="numeric" autocomplete="new-password" pattern="[0-9]{6}" maxlength="6" required></label>
        <label>Confirm PIN<input id="confirmPin" type="password" inputmode="numeric" autocomplete="new-password" pattern="[0-9]{6}" maxlength="6" required></label>
        <button class="primary" type="submit">Set PIN and open Parent Portal</button>
      </form>
      <button id="useExistingPin" type="button" class="text" hidden>Sign in with an existing PIN</button>
      <button id="useNewPin" type="button" class="text" hidden>Create a mobile account</button>
      <form id="resetForm" hidden>
        <label>New password<input id="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label>
        <label>Confirm password<input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label>
        <button class="primary" type="submit">Save password</button>
      </form>
      <button id="dismissInvitation" type="button" class="text" hidden>Dismiss invitation</button>
      <p id="authMessage" role="status" aria-live="polite"></p>
      <div class="auth-links"><a href="/parents">Open the family portal</a><a href="/">Open inventory</a></div>
    </div>
  </main>

  <div id="workspace" class="layout" hidden>
    <aside id="schoolSidebar" class="sidebar">
      <a class="sidebar-brand" href="/school" aria-label="OctoMinds school overview">
        <img class="brand" src="/assets/octominds-logo-horizontal.png" alt="">
      </a>
      <nav id="navigation" aria-label="School navigation"></nav>
      <div class="app-links">
        <a href="/parents">Open the family portal<span aria-hidden="true">↗</span></a>
        <a id="inventoryLink" href="/">Open inventory<span aria-hidden="true">↗</span></a>
      </div>
    </aside>

    <header class="topbar">
      <button id="navToggle" class="menu-button" type="button" aria-controls="schoolSidebar" aria-expanded="false"><span aria-hidden="true"></span> Menu</button>
      <p class="workspace-label">School administration</p>
      <label class="center-label">Working center<select id="centerSelect" disabled><option value="">Loading centers…</option></select></label>
      <div class="identity">
        <span id="userInitials" class="avatar" aria-hidden="true"></span>
        <div class="identity-text"><strong id="userName"></strong><span id="userRole"></span></div>
      </div>
      <button id="signOut" type="button">Sign out</button>
    </header>

    <main id="main" tabindex="-1">
      <div class="page-top">
        <div class="page-copy"><h1 id="pageTitle"></h1><p id="pageDescription"></p></div>
        <div id="toolbar" class="toolbar" aria-label="Page actions"></div>
      </div>
      <div id="content"></div>
    </main>
  </div>

  <dialog id="editor" aria-labelledby="editorTitle" aria-describedby="editorHint">
    <form id="editorForm">
      <div class="dialog-head">
        <h2 id="editorTitle"></h2>
        <button class="close" type="button" data-close aria-label="Close form">×</button>
      </div>
      <p id="editorHint"></p>
      <div id="fields" class="form-grid"></div>
      <p id="formError" role="alert"></p>
      <div class="dialog-actions">
        <button type="button" data-close>Cancel</button>
        <button class="primary" type="submit">Save changes</button>
      </div>
    </form>
  </dialog>

  <dialog id="resultDialog" aria-labelledby="resultTitle">
    <h2 id="resultTitle">Invitation ready</h2>
    <p id="inviteInstructions"></p>
    <label>Invitation link<input id="inviteLink" readonly></label>
    <div class="dialog-actions">
      <button type="button" data-close>Done</button>
      <button id="copyInvite" class="primary" type="button">Copy link</button>
    </div>
    <p id="copyStatus" class="copy-status" role="status"></p>
  </dialog>
  <p id="notice" class="notice" role="status" aria-live="polite" hidden></p>
  <script src="/config.js"></script>
  <script src="/apps/school/school.js?v=workspace-load-1"></script>
</body>
</html>
